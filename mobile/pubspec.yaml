name: woolu
description: "Woolu AI - Comprendre. Sécuriser. Résoudre."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.1
  google_mlkit_text_recognition: ^0.15.0
  google_fonts: ^6.3.2
  phosphor_flutter: ^2.1.0
  flutter_animate: ^4.5.2
  pdf: ^3.11.3
  printing: ^5.14.3
  share_plus: ^12.0.2
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0B7A63"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true
